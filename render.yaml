# CaseNexus AICTE Render Blueprint
# Version: 1.0.1
services:
  - type: web
    name: casenexus-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.start
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: casenexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://26sih264.vercel.app,https://*.vercel.app

databases:
  - name: casenexus-db
    plan: free
    databaseName: aicte
    user: aicte
